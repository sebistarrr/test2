<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Elemental Duel — elemental arena</title>
<meta name="description" content="Duel 2D (Canvas) — clone haute fidélité : Ombre, Glace, Feu, Eau, Lumière, Foudre, Vent, Plante, plus le Hors-la-loi et le Bretteur." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231c1a26'/><circle cx='11' cy='16' r='7' fill='%23870286'/><circle cx='22' cy='16' r='7' fill='%2300eff0'/></svg>" />

<!-- Polices auto-hébergées (assets/fonts) : aucune requête externe, donc un
     rendu identique hors-ligne comme sur GitHub Pages. Le Canvas attend leur
     chargement avant la première frame (src/core/fonts.js). -->
<link rel="preload" href="./assets/fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="./assets/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin />

<link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <div id="app">
    <!-- Toute la scène de combat (titre, arène, HUD) est dessinée dans ce canvas,
         en coordonnées logiques 720x1280 identiques à la vidéo de référence. -->
    <canvas id="stage" width="720" height="1280" aria-label="Duel arena"></canvas>

    <!-- Écran de sélection (DOM, superposé au canvas) -->
    <section id="screen-select" class="screen" aria-label="Fighter selection">
      <h1 class="select-title">CHOOSE YOUR FIGHTERS</h1>

      <div class="modes" id="modes" role="group" aria-label="Match format">
        <button class="mode" data-mode="duel" type="button" aria-pressed="true">DUEL</button>
        <button class="mode" data-mode="teams" type="button" aria-pressed="false">2 VS 2</button>
        <button class="mode" data-mode="royale" type="button" aria-pressed="false">BATTLE ROYALE</button>
      </div>

      <!-- Les emplacements sont construits par `ui/select.js` : leur nombre et
           leur groupement dépendent du format choisi. -->
      <div class="slots" id="slots"></div>

      <div class="royale-size" id="royale-size" hidden>
        <button class="size-btn" id="size-less" type="button" aria-label="One fewer fighter">−</button>
        <span class="size-label" id="size-label">4</span>
        <button class="size-btn" id="size-more" type="button" aria-label="One more fighter">+</button>
      </div>

      <p class="select-hint">Pick a slot, then pick a fighter.</p>

      <div class="roster" id="roster" role="listbox" aria-label="Available fighters"></div>

      <div class="element-sheet" id="element-sheet" hidden></div>

      <button class="start-btn" id="btn-start" type="button">START THE DUEL</button>
    </section>

    <!-- Écran de fin -->
    <section id="screen-result" class="screen hidden" aria-label="Duel result">
      <div class="result-card">
        <p class="result-kicker">K.O.</p>
        <h2 class="result-winner" id="result-winner">—</h2>
        <p class="result-detail" id="result-detail"></p>
        <!-- Classement d'une partie à plusieurs. Vide et masqué en duel. -->
        <ol class="result-standings" id="result-standings" hidden></ol>
        <div class="result-actions">
          <button class="start-btn" id="btn-rematch" type="button">REMATCH</button>
          <button class="ghost-btn" id="btn-replay" type="button">WATCH IT AGAIN</button>
          <button class="ghost-btn export-btn" id="btn-export" type="button" hidden>EXPORT AS SHORT</button>
          <p class="result-note" id="result-export-note" hidden></p>
          <button class="ghost-btn" id="btn-back" type="button">CHANGE FIGHTERS</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
  <noscript>
    <p style="font-family:sans-serif;text-align:center">This duel needs JavaScript.</p>
  </noscript>
</body>
</html>
