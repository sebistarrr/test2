name: Déploiement GitHub Pages

# Le site est désormais construit : React + TypeScript passent par Vite,
# on publie `dist/` et non plus la racine du dépôt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on annule celle en cours si un nouveau
# commit arrive, pour ne pas publier une version périmée.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      # Le typage est vérifié avant de publier : `npm run build` enchaîne
      # `tsc -b` puis `vite build`, un type cassé arrête le déploiement.
      - name: Build
        run: npm run build

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Empaquetage de dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
