name: Déploiement GitHub Pages

# Le site est constitué de fichiers statiques : rien à compiler, on publie
# la racine du dépôt telle quelle.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on annule celle en cours si un nouveau
# commit arrive, pour ne pas publier une version périmée.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Empaquetage de la racine
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publication
        id: deployment
        uses: actions/deploy-pages@v4
